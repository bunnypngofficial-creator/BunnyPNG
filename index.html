<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BunnyPNG - Free Transparent PNG Images</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary-yellow: #FFD700;
            --dark-bg: #0a0a0a;
            --card-bg: #111111;
            --text-white: #ffffff;
            --text-gray: #b0b0b0;
            --border-color: #222222;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--dark-bg);
            color: var(--text-white);
            line-height: 1.6;
        }
        .navbar {
            position: sticky; top: 0; z-index: 1000;
            background: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-color);
            padding: 15px 25px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .logo { font-size: 1.8rem; font-weight: 800; text-decoration: none; display: flex; align-items: center; }
        .logo .bunny { color: white; }
        .logo .png { color: var(--primary-yellow); }
        .hero { text-align: center; padding: 80px 25px; }
        .search-container { max-width: 500px; margin: 20px auto; width: 100%; }
        .search-input {
            width: 100%; padding: 12px 20px; border: 2px solid var(--border-color);
            border-radius: 50px; background: rgba(255, 255, 255, 0.05); color: white; outline: none;
        }
        .section { padding: 40px 25px; max-width: 1200px; margin: 0 auto; }
        .section-title { font-size: 2rem; text-align: center; margin-bottom: 40px; }
        .png-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
        }
        .png-card {
            background: var(--card-bg); border-radius: 12px; overflow: hidden;
            border: 1px solid var(--border-color); transition: 0.3s; padding: 15px; text-align: center;
        }
        .png-card:hover { border-color: var(--primary-yellow); }
        .png-image-wrapper { height: 180px; display: flex; align-items: center; justify-content: center; margin-bottom: 15px; }
        .png-image-wrapper img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .png-title { font-size: 0.9rem; margin-bottom: 15px; height: 35px; overflow: hidden; }
        .download-btn {
            display: inline-block; padding: 8px 18px; background: var(--primary-yellow);
            color: #000; text-decoration: none; font-weight: 700; border-radius: 20px; font-size: 0.85rem;
        }
        .loader { width: 40px; height: 40px; border: 4px solid #222; border-top-color: var(--primary-yellow); border-radius: 50%; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="#" class="logo"><span class="bunny">Bunny</span><span class="png">PNG</span></a>
        <div style="font-size: 0.8rem; color: var(--text-gray);">xbunnypng.blogspot.com</div>
    </nav>

    <section class="hero">
        <h1 style="font-size: 2.5rem;">Free <span style="color:var(--primary-yellow)">PNG</span> Assets</h1>
        <div class="search-container">
            <input type="text" class="search-input" id="searchInput" placeholder="Search images...">
        </div>
    </section>

    <section class="section">
        <h2 class="section-title">Latest Images</h2>
        <div id="loader" class="loader"></div>
        <div class="png-grid" id="pngGrid"></div>
    </section>

    <script>
        // *** වෙනස් කළ යුතු ප්‍රධාන ලින්ක් එක ***
        const blogName = "xbunnypng"; 

        async function loadImages() {
            const pngGrid = document.getElementById('pngGrid');
            const loader = document.getElementById('loader');

            try {
                // v2 JSON Feed එක භාවිතා කිරීම (CORS ප්‍රශ්න අවමයි)
                const response = await fetch(`https://${blogName}.blogspot.com/feeds/posts/default?alt=json-in-script&callback=handleResponse`);
                const scriptText = await response.text();
                
                // callback එක හරහා එන දත්ත තේරුම් ගැනීම
                const jsonString = scriptText.substring(scriptText.indexOf('handleResponse(') + 15, scriptText.lastIndexOf(');'));
                const data = JSON.parse(jsonString);
                const posts = data.feed.entry;

                loader.style.display = 'none';
                pngGrid.innerHTML = '';

                if (!posts) {
                    pngGrid.innerHTML = "<p>No posts found!</p>";
                    return;
                }

                posts.forEach(post => {
                    const title = post.title.$t;
                    const link = post.link.find(l => l.rel === 'alternate').href;
                    
                    let imgUrl = "";
                    if (post.media$thumbnail) {
                        imgUrl = post.media$thumbnail.url.replace('s72-c', 's1600');
                    } else if (post.content && post.content.$t.includes("<img")) {
                        const srcMatch = post.content.$t.match(/src="([^"]+)"/);
                        if (srcMatch) imgUrl = srcMatch[1];
                    }

                    if (imgUrl) {
                        pngGrid.innerHTML += `
                            <div class="png-card">
                                <div class="png-image-wrapper"><img src="${imgUrl}" alt="${title}"></div>
                                <h3 class="png-title">${title}</h3>
                                <a href="${link}" class="download-btn" target="_blank">Download</a>
                            </div>
                        `;
                    }
                });
            } catch (e) {
                loader.style.display = 'none';
                pngGrid.innerHTML = "<p>Error loading images. Please ensure your Blog Feed is set to 'Full' in Blogger Settings.</p>";
                console.error(e);
            }
        }

        document.getElementById('searchInput').addEventListener('input', function(e) {
            const term = e.target.value.toLowerCase();
            document.querySelectorAll('.png-card').forEach(card => {
                const title = card.querySelector('.png-title').textContent.toLowerCase();
                card.style.display = title.includes(term) ? 'block' : 'none';
            });
        });

        loadImages();
    </script>
</body>
</html>
