<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BunnyPNG - Free Transparent PNG Images</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* CSS Styles */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary-yellow: #FFD700;
            --dark-bg: #0a0a0a;
            --card-bg: #111111;
            --text-white: #ffffff;
            --text-gray: #b0b0b0;
            --border-color: #222222;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--dark-bg);
            color: var(--text-white);
            line-height: 1.6;
            overflow-x: hidden;
        }
        .navbar {
            position: sticky; top: 0; z-index: 1000;
            background: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-color);
            padding: 15px 25px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .logo { font-size: 1.8rem; font-weight: 800; text-decoration: none; display: flex; align-items: center; }
        .logo .bunny { color: white; }
        .logo .png { color: var(--primary-yellow); }

        .hero { text-align: center; padding: 80px 25px; background: radial-gradient(circle at center, rgba(255, 215, 0, 0.05) 0%, transparent 70%); }
        .hero h1 { font-size: 3rem; margin-bottom: 10px; }
        .search-container { max-width: 500px; margin: 20px auto; width: 100%; position: relative; }
        .search-input {
            width: 100%; padding: 15px 25px; border: 2px solid var(--border-color);
            border-radius: 50px; background: rgba(255, 255, 255, 0.05); color: white; outline: none; transition: 0.3s;
        }
        .search-input:focus { border-color: var(--primary-yellow); box-shadow: 0 0 20px rgba(255, 215, 0, 0.2); }

        .section { padding: 40px 25px; max-width: 1300px; margin: 0 auto; }
        .section-title { font-size: 2rem; text-align: center; margin-bottom: 40px; }
        .section-title span { color: var(--primary-yellow); }

        .png-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 25px;
        }
        .png-card {
            background: var(--card-bg); border-radius: 20px; overflow: hidden;
            border: 1px solid var(--border-color); transition: 0.3s; padding: 15px; text-align: center;
        }
        .png-card:hover { border-color: var(--primary-yellow); transform: translateY(-5px); }
        .png-image-wrapper { height: 200px; display: flex; align-items: center; justify-content: center; margin-bottom: 15px; background: #151515; border-radius: 10px; }
        .png-image-wrapper img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .png-title { font-size: 1rem; margin-bottom: 15px; height: 45px; overflow: hidden; font-weight: 500; }
        .download-btn {
            display: inline-block; padding: 10px 25px; background: var(--primary-yellow);
            color: #000; text-decoration: none; font-weight: 700; border-radius: 30px; transition: 0.3s;
        }
        .download-btn:hover { transform: scale(1.05); }

        .loader { width: 50px; height: 50px; border: 5px solid #222; border-top-color: var(--primary-yellow); border-radius: 50%; animation: spin 1s linear infinite; margin: 50px auto; }
        @keyframes spin { to { transform: rotate(360deg); } }
        footer { text-align: center; padding: 50px; border-top: 1px solid var(--border-color); color: var(--text-gray); margin-top: 50px; }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="#" class="logo"><span class="bunny">Bunny</span><span class="png">PNG</span></a>
        <div style="color: var(--text-gray); font-size: 0.9rem;">Free PNG Library</div>
    </nav>

    <section class="hero">
        <h1>Find Your <span style="color:var(--primary-yellow)">PNG</span></h1>
        <p style="color:var(--text-gray)">High Quality Transparent Images from xbunnypng</p>
        <div class="search-container">
            <input type="text" class="search-input" id="searchInput" placeholder="Search transparent images...">
        </div>
    </section>

    <section class="section">
        <h2 class="section-title">Latest <span>PNG Images</span></h2>
        <div id="loader" class="loader"></div>
        <div class="png-grid" id="pngGrid"></div>
    </section>

    <footer>
        <p>&copy; 2026 BunnyPNG. All images sourced from <a href="https://xbunnypng.blogspot.com" style="color:var(--primary-yellow); text-decoration:none;">xbunnypng.blogspot.com</a></p>
    </footer>

    <script>
        // --- CONFIGURATION ---
        const blogName = "xbunnypng"; 

        // 1. Function to handle the data from Blogger
        function handleResponse(data) {
            const pngGrid = document.getElementById('pngGrid');
            const loader = document.getElementById('loader');
            const posts = data.feed.entry;

            loader.style.display = 'none';
            pngGrid.innerHTML = '';

            if (!posts) {
                pngGrid.innerHTML = "<p style='grid-column: 1/-1; text-align:center;'>No PNGs found in Blogger!</p>";
                return;
            }

            posts.forEach(post => {
                const title = post.title.$t;
                const link = post.link.find(l => l.rel === 'alternate').href;
                
                let imgUrl = "";
                // Try to get high resolution image
                if (post.media$thumbnail) {
                    imgUrl = post.media$thumbnail.url.replace('s72-c', 's1600');
                } else if (post.content && post.content.$t.includes("<img")) {
                    const srcMatch = post.content.$t.match(/src="([^"]+)"/);
                    if (srcMatch) imgUrl = srcMatch[1];
                }

                if (imgUrl) {
                    pngGrid.innerHTML += `
                        <div class="png-card">
                            <div class="png-image-wrapper"><img src="${imgUrl}" alt="${title}"></div>
                            <h3 class="png-title">${title}</h3>
                            <a href="${link}" class="download-btn" target="_blank">Download</a>
                        </div>
                    `;
                }
            });
        }

        // 2. Load Blogger Data using JSONP (This bypasses CORS errors)
        function loadImages() {
            const script = document.createElement('script');
            script.src = `https://${blogName}.blogspot.com/feeds/posts/default?alt=json-in-script&callback=handleResponse&max-results=50`;
            document.body.appendChild(script);
        }

        // 3. Search logic
        document.getElementById('searchInput').addEventListener('input', function(e) {
            const term = e.target.value.toLowerCase();
            document.querySelectorAll('.png-card').forEach(card => {
                const title = card.querySelector('.png-title').textContent.toLowerCase();
                card.style.display = title.includes(term) ? 'block' : 'none';
            });
        });

        // Initialize
        loadImages();
    </script>
</body>
</html>
